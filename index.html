<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>LeetCode Performance Dashboard</h1>

        <div class="user-container">
            <p>Enter your username below:</p>

            <div class="user-input-container">
                <input type="text" placeholder="Enter your username" id="user-input">
                <button id="search-button">Search</button>
            </div>
            <p id="error-message" class="error-message"></p>
        </div>

        <div class="stats-container">

            <div class="progress">
                <div class="progress-item">
                    <div class="easy-progress circle">
                        <span id="easy-label">0/0</span>
                        <p class="difficulty-title">Easy</p>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="medium-progress circle">
                        <span id="medium-label">0/0</span>
                        <p class="difficulty-title">Medium</p>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="hard-progress circle">
                        <span id="hard-label">0/0</span>
                        <p class="difficulty-title">Hard</p>
                    </div>
                </div>
            </div>

            <div class="stats-card">
                <!-- JS will insert user stats here -->
            </div>

        </div>
    </div>

    <script src="java.js"></script>
</body>
</html>
